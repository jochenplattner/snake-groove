<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Groove UML - Scene Flow State Diagram</title>
  <style>
    :root {
      --bg: #10141b;
      --panel: #151b25;
      --text: #f5f7fb;
      --muted: #aeb8c8;
      --line: #a7b7cf;
      --green: #74d680;
      --blue: #80b7ff;
      --yellow: #f0c866;
      --pink: #ef8297;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Segoe UI, Inter, system-ui, sans-serif; }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 48px; }
    .topbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    a { color: var(--text); text-decoration: none; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 9px 12px; background: rgba(255,255,255,.06); }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 52px); letter-spacing: 0; }
    .subtitle { color: var(--muted); max-width: 900px; line-height: 1.55; }
    .diagram { overflow-x: auto; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; background: var(--panel); padding: 12px; }
    svg { display: block; min-width: 1080px; width: 100%; height: auto; }
    .state { fill: #202938; stroke: var(--line); stroke-width: 1.4; rx: 8; }
    .entry { stroke: var(--blue); }
    .menu { stroke: var(--yellow); }
    .game { stroke: var(--green); }
    .terminal { stroke: var(--pink); }
    .start { fill: var(--green); }
    .end { fill: none; stroke: var(--pink); stroke-width: 4; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.6; marker-end: url(#arrow); }
    .return { fill: none; stroke: var(--green); stroke-width: 1.5; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    .title { fill: var(--text); font: 700 17px Segoe UI, sans-serif; text-anchor: middle; }
    .small { fill: var(--muted); font: 13px Segoe UI, sans-serif; text-anchor: middle; }
    .label { fill: #d8e1ef; font: 13px Segoe UI, sans-serif; }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <a href="./index.html">Back to UML index</a>
      <a href="./unity-to-core-sequence-diagram.html">Unity-to-Core sequence</a>
    </div>

    <h1>Scene Flow State Diagram</h1>
    <p class="subtitle">
      Поток сцен остаётся Unity-уровнем, а внутри `Game.unity` запускается `SnakeRunner`
      с `GameSession`. Завершение игры различается как `GameOver` или `LevelComplete`.
    </p>

    <section class="diagram" aria-label="Scene flow state diagram">
      <svg viewBox="0 0 1080 740" role="img" aria-labelledby="diagramTitle diagramDesc">
        <title id="diagramTitle">Scene Flow State Diagram</title>
        <desc id="diagramDesc">State diagram for Unity scenes and current GameSession outcomes.</desc>
        <defs>
          <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M2,2 L10,6 L2,10 Z" fill="#a7b7cf"/>
          </marker>
        </defs>

        <circle class="start" cx="80" cy="130" r="15"/>

        <g transform="translate(150 80)">
          <rect class="state entry" width="210" height="100"/>
          <text class="title" x="105" y="42">Boot.unity</text>
          <text class="small" x="105" y="70">BootLoader.Start()</text>
        </g>

        <g transform="translate(460 80)">
          <rect class="state menu" width="250" height="130"/>
          <text class="title" x="125" y="42">MainMenu.unity</text>
          <text class="small" x="125" y="72">MainMenuScreen</text>
          <text class="small" x="125" y="98">Start / Settings / Exit</text>
        </g>

        <g transform="translate(455 335)">
          <rect class="state game" width="300" height="165"/>
          <text class="title" x="150" y="42">Game.unity</text>
          <text class="small" x="150" y="72">SnakeRunner</text>
          <text class="small" x="150" y="98">GameSessionFactory</text>
          <text class="small" x="150" y="124">GameSession.Tick()</text>
          <text class="small" x="150" y="148">Snapshot -> View</text>
        </g>

        <g transform="translate(115 350)">
          <rect class="state menu" width="230" height="120"/>
          <text class="title" x="115" y="42">Settings</text>
          <text class="small" x="115" y="72">planned screen</text>
          <text class="small" x="115" y="96">volume / board / theme</text>
        </g>

        <g transform="translate(825 95)">
          <rect class="state terminal" width="190" height="100"/>
          <text class="title" x="95" y="42">Exit</text>
          <text class="small" x="95" y="72">Quit or stop editor</text>
        </g>

        <g transform="translate(815 385)">
          <rect class="state terminal" width="205" height="120"/>
          <text class="title" x="102.5" y="42">Session End</text>
          <text class="small" x="102.5" y="72">GameOver</text>
          <text class="small" x="102.5" y="96">LevelComplete</text>
        </g>

        <circle class="end" cx="920" cy="630" r="16"/>

        <path class="arrow" d="M95 130 L150 130"/>
        <text class="label" x="105" y="110">launch</text>

        <path class="arrow" d="M360 130 L460 145"/>
        <text class="label" x="382" y="116">LoadScene(MainMenu)</text>

        <path class="arrow" d="M585 210 L605 335"/>
        <text class="label" x="625" y="285">Start clicked</text>

        <path class="arrow" d="M460 175 C360 225 315 290 235 350"/>
        <text class="label" x="305" y="250">Settings clicked</text>

        <path class="return" d="M230 350 C290 250 385 210 460 183"/>
        <text class="label" x="210" y="315">Back</text>

        <path class="arrow" d="M710 145 L825 145"/>
        <text class="label" x="735" y="128">Exit clicked</text>

        <path class="arrow" d="M755 430 L815 440"/>
        <text class="label" x="760" y="418">Outcome terminal</text>

        <path class="return" d="M815 455 C735 545 590 565 520 500"/>
        <text class="label" x="610" y="555">Restart / Back to menu</text>

        <path class="arrow" d="M918 505 L920 614"/>
        <text class="label" x="935" y="568">quit</text>
      </svg>
    </section>
  </main>
</body>
</html>
